name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ] # Triggers whenever you push to the main branch
  workflow_dispatch:      # Allows you to run it manually from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.hf
          push: true
          # Direct link to your repo: hoopstreet/tiktok-product-scraper
          tags: hoopstreet/tiktok-product-scraper:latest
          # This helps with faster builds on subsequent runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
