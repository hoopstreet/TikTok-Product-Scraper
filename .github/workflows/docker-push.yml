name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.hf
          push: true
          # Using your specific repository and tag
          tags: hoopstreet/tiktok-product-scraper:sync
          # Enables faster builds using GitHub Action cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Hugging Face Sync
        # This step forces Hugging Face to pull the new image from Docker Hub
        run: |
          git config --global user.email "bot@hoopstreet.com"
          git config --global user.name "Hoopstreet Bot"
          git clone https://hoopstreet:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/hoopstreet/TikTok-Product-Scraper hf_space
          cd hf_space
          echo "Build ID: ${{ github.sha }}" > build_info.txt
          git add .
          git commit -m "Syncing Docker Image: sync tag"
          git push origin main
